name: Release

# Push a semver tag to release, e.g.:
#   git tag v1.2.3 && git push origin v1.2.3
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so we can build a changelog

      - uses: docker/setup-buildx-action@v3

      - name: Log in to reg.cadoles.com
        uses: docker/login-action@v3
        with:
          registry: reg.cadoles.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: reg.cadoles.com/cadoles/hydra-oidc-go
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build changelog
        id: changelog
        run: |
          prev="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -n "$prev" ]; then
            range="${prev}..${GITHUB_REF_NAME}"
          else
            range="${GITHUB_REF_NAME}"
          fi
          {
            echo "body<<EOF"
            echo "## ${GITHUB_REF_NAME}"
            echo
            git log --no-merges --pretty='- %s' "$range"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Gitea release
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          BODY: ${{ steps.changelog.outputs.body }}
        run: |
          curl -sSf -X POST \
            "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/releases" \
            -H "Authorization: token ${RELEASE_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg tag "$GITHUB_REF_NAME" \
              --arg body "$BODY" \
              '{tag_name: $tag, name: $tag, body: $body, draft: false, prerelease: false}')"
